%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/apple,dwc3.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple Silicon DWC3 USB controller

maintainers:
  - Sven Peter <sven@kernel.org>

description:
  Apple Silicon SoCs use a Synopsys DesignWare DWC3 based controller for each of
  their Type-C ports.

allOf:
  - $ref: snps,dwc3-common.yaml#

$defs:
  apple,tunable:
    $ref: /schemas/types.yaml#/definitions/uint32-matrix
    items:
      items:
        - description: Register offset
        - description: Bits cleared in the register
        - description: Bits set in the register

properties:
  compatible:
    oneOf:
      - items:
          - enum:
              - apple,t6000-dwc3
              - apple,t6020-dwc3
              - apple,t6040-dwc3
              - apple,t8112-dwc3
              - apple,t8132-dwc3
          - const: apple,t8103-dwc3
      - const: apple,t8103-dwc3

  reg:
    minItems: 2
    items:
      - description: Core DWC3 region
      - description: Apple-specific DWC3 region
      - description: Apple DWC3 configuration region
      - description: USB link controls
      - description: USB bulk fabric controls

  reg-names:
    minItems: 2
    items:
      - const: dwc3-core
      - const: dwc3-apple
      - const: dwc3-cfg
      - const: link
      - const: bulk

  apple,tunable-host:
    $ref: "#/$defs/apple,tunable"
    description: Board tuning relative to DWC3 globals (core plus 0xc100).

  apple,tunable-cfg-host:
    $ref: "#/$defs/apple,tunable"
    description: Board tuning relative to the Apple configuration region.

  apple,tunable-link-host:
    $ref: "#/$defs/apple,tunable"
    description: Host board tuning relative to the USB link region.

  apple,tunable-bulk:
    $ref: "#/$defs/apple,tunable"
    description: Board tuning relative to the USB bulk fabric region.

  interrupts:
    minItems: 1
    maxItems: 2

  interrupt-names:
    items:
      - const: host
      - const: peripheral

  iommus:
    maxItems: 2

  resets:
    maxItems: 1

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - iommus
  - resets
  - power-domains
  - usb-role-switch

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    usb@82280000 {
      compatible = "apple,t8103-dwc3";
      reg = <0x82280000 0xcd00>, <0x8228cd00 0x3200>;
      reg-names = "dwc3-core", "dwc3-apple";
      interrupts = <AIC_IRQ 777 IRQ_TYPE_LEVEL_HIGH>;
      iommus = <&dwc3_0_dart_0 0>, <&dwc3_0_dart_1 1>;

      power-domains = <&ps_atc0_usb>;
      resets = <&atcphy0>;

      usb-role-switch;
    };
